name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck iproute2

      - name: Bash syntax
        run: bash -n vps-network-limiter.sh tests/run.sh

      - name: ShellCheck
        run: shellcheck -x vps-network-limiter.sh tests/run.sh

      - name: Tests
        run: ./tests/run.sh
